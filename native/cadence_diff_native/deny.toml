# cargo-deny configuration for the cadence-diff native engine
# (native/cadence_diff_native/). Run via `cargo deny check` from this directory.
# Release-grade Rust hygiene per plan-20260906-group-first-and-native-kernel.md's
# Phase B design ("cargo audit/cargo deny licence + advisory checks").

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only -- this crate ships as part of a commercially
# distributed tool; no copyleft dependency is acceptable.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
