[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "cadence-diff-native"
dynamic = ["version"]
description = "Native Excel analysis accelerator for cadence-diff"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Rust",
	"Operating System :: Microsoft :: Windows :: Windows 10",
	"Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/rai-himanshu07/cadence-diff"
Repository = "https://github.com/rai-himanshu07/cadence-diff"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "cadence_diff_native"
