[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "xlsbkernel"
dynamic = ["version"]
description = "Optional native BIFF12/XLSB decoder accelerator for cadence-diff"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.maturin]
features = ["pyo3/extension-module"]
