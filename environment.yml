# cadence-diff public development environment.
# Local contributors may substitute another environment name.
name: cadence-diff-dev
channels:
  - conda-forge
dependencies:
  - python=3.11
  # runtime
  - openpyxl>=3.1
  - pyxlsb>=1.0
  - msoffcrypto-tool>=5.4
  - python-pptx>=1.0
  - rapidfuzz>=3.9
  - networkx>=3.2
  - pydantic>=2.13
  - pyyaml>=6.0
  - jinja2>=3.1
  - nicegui>=2.0
  - platformdirs>=4.0
  # dev / checks
  - pytest>=8.0
  - pytest-asyncio>=1.0
  - pytest-cov=7.1.0
  - pip-audit=2.10.1
  - filelock>=3.8  # pip-audit's CacheControl[filecache] runtime extra
  - ruff
  - pyright
  - psutil>=6.0
  # packaging
  - hatchling=1.31.0
  - python-build=1.5.0
  - twine=6.2.0
  - pip
  - pip:
      - "pywin32>=306; sys_platform == 'win32'"
      # Builds the optional native XLSB kernel (native/xlsbkernel/, Rust/PyO3;
      # `maturin develop --release` from that directory); not a runtime
      # dependency of the shipped package -- see pyproject.toml's note.
      - "maturin>=1.5,<2"
