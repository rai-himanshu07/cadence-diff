[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadence-diff"
dynamic = ["version"]
description = "Local, read-only QC and diff tool for cadence Excel/PowerPoint deliverables."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["qc", "excel", "powerpoint", "diff", "reporting", "openpyxl"]
classifiers = [
  # Publication interlock: PyPI rejects this classifier, so accidental
  # uploads fail. Remove it deliberately when the tool is declared ready.
  "Private :: Do Not Upload",
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
  "openpyxl>=3.1",
  "pyxlsb>=1.0",
  "msoffcrypto-tool>=5.4",
  "python-pptx>=1.0",
  "rapidfuzz>=3.9",
  "networkx>=3.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "nicegui>=2.0",
  "platformdirs>=4.0",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "ruff", "pyright", "psutil>=6.0"]

[project.scripts]
cadence-diff = "qc_tool.cli:main"
qc-tool = "qc_tool.cli:main"

[tool.hatch.version]
path = "qc_tool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["qc_tool"]

[tool.hatch.build.targets.sdist]
include = ["qc_tool", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Vendored template/workflow scripts keep their own conventions.
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["qc_tool", "tests"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
