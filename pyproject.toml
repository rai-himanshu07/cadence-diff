[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "cadence-diff"
dynamic = ["version"]
description = "Local, read-only QC and diff tool for cadence Excel/PowerPoint deliverables."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["qc", "excel", "powerpoint", "diff", "reporting", "openpyxl"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
  "openpyxl>=3.1",
  "pyxlsb>=1.0",
  "msoffcrypto-tool>=5.4",
  "python-pptx>=1.0",
  "rapidfuzz>=3.9",
  "pydantic>=2.13",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "nicegui>=2.0",
  "platformdirs>=4.0",
  "pywin32>=306; sys_platform == 'win32'",
  "cadence-diff-native==2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.0",
  "pytest-cov==7.1.0",
  "pip-audit==2.10.1",
  "ruff",
  "pyright",
  "psutil>=6.0",
  "networkx>=3.2",  # tests/dependency_oracle.py parity only
  "maturin>=1.5,<2",  # builds native/cadence_diff_native/ (Rust/PyO3)
]
native = [
  "cadence-diff-native==2.0.0",
]

# The native engine is an automatic runtime dependency. Its distribution ships
# platform-specific Rust wheels plus a universal fallback wheel, so normal pip
# installs never require a local Rust toolchain. The `native` extra remains as a
# compatibility alias for existing installation commands.

[project.scripts]
cadence-diff = "qc_tool.cli:main"
qc-tool = "qc_tool.cli:main"

[project.urls]
Homepage = "https://github.com/rai-himanshu07/cadence-diff"
Repository = "https://github.com/rai-himanshu07/cadence-diff"
Issues = "https://github.com/rai-himanshu07/cadence-diff/issues"
Releases = "https://github.com/rai-himanshu07/cadence-diff/releases"

[tool.hatch.version]
path = "qc_tool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["qc_tool"]

[tool.hatch.build.targets.sdist]
include = ["/qc_tool", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Vendored template/workflow scripts keep their own conventions.
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["qc_tool", "tests"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["qc_tool"]

[tool.coverage.report]
show_missing = true
