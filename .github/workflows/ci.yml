name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          activate-environment: cadence-diff-ci
          python-version: ${{ matrix.python }}
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install quality dependencies with Conda
        run: >-
          conda install --yes --name cadence-diff-ci --channel conda-forge
          openpyxl pyxlsb msoffcrypto-tool python-pptx rapidfuzz networkx
          "pydantic>=2.13" pyyaml jinja2 nicegui platformdirs
          "pytest>=8" pytest-asyncio ruff pyright psutil

      - name: Install Windows adapter dependency with Conda
        if: runner.os == 'Windows'
        run: conda install --yes --name cadence-diff-ci --channel conda-forge pywin32

      - name: Audit tracked public tree
        run: conda run --name cadence-diff-ci python scripts/audit_public_tree.py

      - name: Run tests
        run: conda run --name cadence-diff-ci pytest -q

      - name: Run Ruff
        run: conda run --name cadence-diff-ci ruff check .

      - name: Run Pyright
        run: conda run --name cadence-diff-ci pyright

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build and validate distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
          python scripts/audit_distributions.py dist

      - name: Clean-wheel install smoke
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .wheel-smoke/bin/cadence-diff --help
          .wheel-smoke/bin/qc-tool --help
          .wheel-smoke/bin/python -m qc_tool --help

      - name: Upload validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
