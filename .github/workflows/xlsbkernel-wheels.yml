name: xlsbkernel wheels

# Builds the optional native XLSB kernel (native/xlsbkernel/) as its OWN,
# separately-versioned wheel -- it is never published from this workflow and
# is not a dependency of the main `cadence-diff` distribution's own build
# (which stays on Hatchling, unaffected by anything here). This proves
# Criterion 9's packaging bar: platform wheels build in CI for Linux x86_64
# and Windows x64, and records them as workflow artifacts for manual
# inspection or a future, separately-authorized publication step.
#
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/xlsbkernel/**"
      - ".github/workflows/xlsbkernel-wheels.yml"
  push:
    branches: [main]
    paths:
      - "native/xlsbkernel/**"
      - ".github/workflows/xlsbkernel-wheels.yml"

permissions:
  contents: read

jobs:
  linux:
    name: Build wheel (Linux x86_64 / Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: native/xlsbkernel
          target: x86_64
          args: --release --out dist --interpreter python
          manylinux: auto

      - name: Install and smoke-test the built wheel
        run: |
          python -m venv .kernel-smoke
          .kernel-smoke/bin/pip install --disable-pip-version-check native/xlsbkernel/dist/*.whl
          .kernel-smoke/bin/python -c "import xlsbkernel; print(xlsbkernel.__doc__ or 'imported ok')"
          test "$(find native/xlsbkernel/dist -name '*-cp311-abi3-*.whl' | wc -l)" -eq 1

      - name: Prove cadence-diff native-extra bundle install
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0"
          python -m build --wheel --outdir bundle-dist
          python -m venv .bundle-smoke
          .bundle-smoke/bin/pip install --disable-pip-version-check \
            openpyxl pyxlsb msoffcrypto-tool python-pptx rapidfuzz pydantic \
            pyyaml jinja2 nicegui platformdirs
          .bundle-smoke/bin/pip install --disable-pip-version-check \
            --no-index --no-deps bundle-dist/*.whl native/xlsbkernel/dist/*.whl
          .bundle-smoke/bin/python -c "import qc_tool, xlsbkernel"

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xlsbkernel-linux-x86_64-py${{ matrix.python-version }}
          path: native/xlsbkernel/dist
          if-no-files-found: error

  windows:
    name: Build wheel (Windows x64 / Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: native/xlsbkernel
          target: x64
          args: --release --out dist --interpreter python

      - name: Install and smoke-test the built wheel
        shell: pwsh
        run: |
          python -m venv .kernel-smoke
          $wheel = Get-ChildItem native/xlsbkernel/dist/*.whl | Select-Object -First 1
          if ($wheel.Name -notmatch '-cp311-abi3-') { throw "wheel is not tagged cp311-abi3" }
          .kernel-smoke\Scripts\pip.exe install --disable-pip-version-check $wheel.FullName
          .kernel-smoke\Scripts\python.exe -c "import xlsbkernel; print(xlsbkernel.__doc__ or 'imported ok')"

      - name: Prove cadence-diff native-extra bundle install
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0"
          python -m build --wheel --outdir bundle-dist
          python -m venv .bundle-smoke
          .bundle-smoke\Scripts\pip.exe install --disable-pip-version-check `
            openpyxl pyxlsb msoffcrypto-tool python-pptx rapidfuzz pydantic `
            pyyaml jinja2 nicegui platformdirs pywin32
          $mainWheel = Get-ChildItem bundle-dist/*.whl | Select-Object -First 1
          $nativeWheel = Get-ChildItem native/xlsbkernel/dist/*.whl | Select-Object -First 1
          .bundle-smoke\Scripts\pip.exe install --disable-pip-version-check `
            --no-index --no-deps $mainWheel.FullName $nativeWheel.FullName
          .bundle-smoke\Scripts\python.exe -c "import qc_tool, xlsbkernel"

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xlsbkernel-windows-x64-py${{ matrix.python-version }}
          path: native/xlsbkernel/dist
          if-no-files-found: error
