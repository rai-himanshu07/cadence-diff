name: cadence-diff-native wheels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/cadence_diff_native/**"
      - ".github/workflows/native-wheels.yml"
      - "tests/test_native_packaging.py"
  push:
    branches: [main]
    paths:
      - "native/cadence_diff_native/**"
      - ".github/workflows/native-wheels.yml"
      - "tests/test_native_packaging.py"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64 native wheel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.9.6
          working-directory: native/cadence_diff_native
          target: x86_64
          manylinux: 2014
          args: >-
            --release --locked --out dist
            --interpreter python3.11
      - name: Verify wheel tag
        run: >-
          test "$(find native/cadence_diff_native/dist
          -name '*-cp311-abi3-*manylinux2014_x86_64.whl' | wc -l)" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cadence-diff-native-linux-x86_64
          path: native/cadence_diff_native/dist/*.whl
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 native wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: x64
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.9.6
          working-directory: native/cadence_diff_native
          target: x64
          args: --release --locked --compatibility pypi --out dist --interpreter python
      - name: Verify wheel tag
        shell: pwsh
        run: |
          $wheel = Get-ChildItem native/cadence_diff_native/dist/*.whl
          if ($wheel.Count -ne 1 -or $wheel.Name -notmatch '-cp311-abi3-win_amd64.whl$') {
            throw "expected one cp311-abi3-win_amd64 wheel"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cadence-diff-native-windows-x64
          path: native/cadence_diff_native/dist/*.whl
          if-no-files-found: error

  build-fallback:
    name: Build universal fallback wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build fallback
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0"
          python -m build --wheel --outdir native/cadence_diff_native/fallback/dist \
            native/cadence_diff_native/fallback
          test "$(find native/cadence_diff_native/fallback/dist \
            -name '*-py3-none-any.whl' | wc -l)" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cadence-diff-native-fallback
          path: native/cadence_diff_native/fallback/dist/*.whl
          if-no-files-found: error

  audit-artifacts:
    name: Audit exact helper artifact set
    needs: [build-linux, build-windows, build-fallback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cadence-diff-native-*
          path: helper-dist
          merge-multiple: true
      - name: Audit wheel-only helper release
        run: python scripts/audit_native_distributions.py helper-dist

  smoke-linux:
    name: Smoke Linux native wheel / Python ${{ matrix.python-version }}
    needs: [build-linux, audit-artifacts]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cadence-diff-native-linux-x86_64
          path: wheelhouse
      - name: Install exact artifact
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0"
          python -m build --wheel --outdir main-dist
          python -m venv .bundle-smoke
          .bundle-smoke/bin/python -m pip install --disable-pip-version-check \
            --find-links wheelhouse --only-binary=cadence-diff-native \
            main-dist/*.whl
          .bundle-smoke/bin/python -c "import qc_tool, cadence_diff_native as n; assert n.__native_available__ is True; assert n.__kernel_api_version__ == 1"

  smoke-windows:
    name: Smoke Windows native wheel / Python ${{ matrix.python-version }}
    needs: [build-windows, audit-artifacts]
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cadence-diff-native-windows-x64
          path: wheelhouse
      - name: Install exact artifact
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0"
          python -m build --wheel --outdir main-dist
          python -m venv .bundle-smoke
          $mainWheel = Get-ChildItem main-dist/*.whl | Select-Object -First 1
          .bundle-smoke\Scripts\python.exe -m pip install --disable-pip-version-check `
            --find-links wheelhouse --only-binary=cadence-diff-native `
            $mainWheel.FullName
          .bundle-smoke\Scripts\python.exe -c "import qc_tool, cadence_diff_native as n; assert n.__native_available__ is True; assert n.__kernel_api_version__ == 1"

  smoke-fallback:
    name: Smoke fallback wheel / Python ${{ matrix.python-version }}
    needs: [build-fallback, audit-artifacts]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cadence-diff-native-fallback
          path: wheelhouse
      - name: Install exact artifact
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0"
          python -m build --wheel --outdir main-dist
          python -m venv .bundle-smoke
          .bundle-smoke/bin/python -m pip install --disable-pip-version-check \
            --find-links wheelhouse --only-binary=cadence-diff-native \
            main-dist/*.whl
          .bundle-smoke/bin/python -c "import qc_tool, cadence_diff_native as n; assert n.__native_available__ is False; assert n.__kernel_api_version__ == 1"
