name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Require the deliberate publication commit
        run: |
          if grep -Fq 'Private :: Do Not Upload' pyproject.toml; then
            echo 'Publication interlock is still enabled.' >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import qc_tool
          tag = os.environ['GITHUB_REF_NAME']
          expected = f"v{qc_tool.__version__}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          PY

      - name: Build and validate once
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
          python scripts/audit_distributions.py dist
          sha256sum dist/* | tee dist/SHA256SUMS

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish exact artifacts
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist

      - name: Verify artifact hashes
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          rm SHA256SUMS

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist
          attestations: true
