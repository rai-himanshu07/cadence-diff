name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Require the deliberate publication commit
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -Fq 'Private :: Do Not Upload' pyproject.toml; then
            echo 'Publication interlock is still enabled.' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          import qc_tool

          tag = os.environ['RELEASE_TAG']
          expected = f"v{qc_tool.__version__}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                  f"/releases/tags/{tag}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  release = json.load(response)
              if release.get('draft') or not release.get('published_at'):
                  raise SystemExit(f"release {tag!r} is not published")
          PY

      - name: Build and validate once
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0" "twine==6.2.0"
          python -m build
          python -m twine check dist/*
          python scripts/audit_distributions.py dist
          cd dist
          sha256sum *.whl *.tar.gz | tee SHA256SUMS

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish exact artifacts
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist

      - name: Verify artifact hashes
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          rm SHA256SUMS

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist
          attestations: true
